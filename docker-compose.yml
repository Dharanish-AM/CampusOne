version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: campusone_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - campusone_network

  redis:
    image: redis:alpine
    container_name: campusone_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - campusone_network

volumes:
  mongodb_data:
  redis_data:

networks:
  campusone_network:
    driver: bridge
